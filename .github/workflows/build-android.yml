name: Build Android App (TWA)

# Builds a signed Android App Bundle (.aab) + APK from the PWA using
# Bubblewrap, and uploads them as workflow artifacts.
#
# Uses two well-established, widely-used GitHub Actions to set up the JDK
# and Android SDK (actions/setup-java + android-actions/setup-android),
# rather than relying on Bubblewrap's own bundled-dependency container —
# that container turned out not to ship a pre-installed Android SDK, which
# caused Bubblewrap's interactive "install JDK/SDK?" prompt to hang CI
# with no stdin available (see GoogleChromeLabs/bubblewrap#806 for the
# general class of problem). Once both are set up, this workflow points
# Bubblewrap at them directly with the documented, non-interactive
# `bubblewrap updateConfig` command — no prompt is ever triggered.
#
# `bubblewrap build` alone does NOT generate the native Android project —
# only `init`/`update` do that — so this workflow runs `update` first to
# regenerate the project from twa-manifest.json, then `build`.
#
# ONE-TIME SETUP REQUIRED BEFORE THIS WORKFLOW WILL WORK — see
# docs/ANDROID.md. In short:
#   1. Deploy frontend/ to a live HTTPS URL.
#   2. Commit twa-manifest.json to the repo root (already done if you
#      followed docs/ANDROID.md).
#   3. Add these repository secrets (Settings → Secrets and variables →
#      Actions): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#      ANDROID_KEY_PASSWORD. (The key alias comes from twa-manifest.json
#      itself, not a secret.)
#   4. Update frontend/.well-known/assetlinks.json with the real
#      package name + SHA-256 fingerprint and redeploy the frontend.
#
# Without step 1-2, this workflow has nothing to build from and will fail
# at the "Check twa-manifest.json exists" step — that's expected until
# the one-time setup is done.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'twa-manifest.json'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check twa-manifest.json exists
        run: |
          if [ ! -f twa-manifest.json ]; then
            echo "::error::twa-manifest.json not found in repo root. See docs/ANDROID.md."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Point Bubblewrap at the installed JDK and Android SDK
        # actions/setup-java exports $JAVA_HOME; android-actions/setup-android
        # exports $ANDROID_SDK_ROOT (falling back to $ANDROID_HOME just in
        # case). `updateConfig` is Bubblewrap's own documented, non-
        # interactive command for setting these — this runs before `update`
        # so the "Do you want Bubblewrap to install the JDK/SDK?" prompt
        # never fires in the first place.
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$JAVA_HOME" ] || [ -z "$SDK_PATH" ]; then
            echo "::error::JAVA_HOME or Android SDK path is empty — see the values printed above."
            exit 1
          fi
          bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$SDK_PATH"
          cat "$HOME/.bubblewrap/config.json"

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — see docs/ANDROID.md."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android.keystore

      - name: Regenerate Android project from twa-manifest.json
        run: bubblewrap update --skipVersionUpgrade

      - name: Build signed app bundle + APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Upload app bundle + APK
        uses: actions/upload-artifact@v4
        with:
          name: makari-islamic-tv-android
          path: |
            app-release-signed.aab
            app-release-signed.apk
          if-no-files-found: error

      - name: Clean up keystore
        if: always()
        run: rm -f android.keystore
