name: Build Android App (TWA)

# Builds a signed Android App Bundle (.aab) + APK from the PWA using
# Bubblewrap, and uploads them as workflow artifacts.
#
# ONE-TIME SETUP REQUIRED BEFORE THIS WORKFLOW WILL WORK — see
# docs/ANDROID.md. In short:
#   1. Deploy frontend/ to a live HTTPS URL.
#   2. Run `bubblewrap init` locally against that URL (interactive —
#      picks your package name and creates a signing keystore).
#   3. Commit the generated twa-manifest.json to this repo.
#   4. Add these repository secrets (Settings → Secrets and variables →
#      Actions): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#      ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
#   5. Update frontend/.well-known/assetlinks.json with the real
#      package name + SHA-256 fingerprint (bubblewrap prints this after
#      init) and redeploy the frontend.
#
# Without step 1-3, this workflow has nothing to build from and will fail
# at the "bubblewrap build" step — that's expected until the one-time
# setup is done.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'twa-manifest.json'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check twa-manifest.json exists
        run: |
          if [ ! -f twa-manifest.json ]; then
            echo "::error::twa-manifest.json not found. Run 'bubblewrap init' locally first — see docs/ANDROID.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — see docs/ANDROID.md."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android.keystore

      - name: Build signed app bundle + APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --password "$ANDROID_KEYSTORE_PASSWORD" \
            --keyAlias "$ANDROID_KEY_ALIAS" \
            --keyPassword "$ANDROID_KEY_PASSWORD"

      - name: Upload app bundle + APK
        uses: actions/upload-artifact@v4
        with:
          name: makari-islamic-tv-android
          path: |
            app-release-signed.aab
            app-release-signed.apk
          if-no-files-found: error

      - name: Clean up keystore
        if: always()
        run: rm -f android.keystore
