name: Build Android App (TWA)

# Builds a signed Android App Bundle (.aab) + APK from the PWA using
# Bubblewrap, and uploads them as workflow artifacts.
#
# Uses Google's official prebuilt container (ghcr.io/googlechromelabs/
# bubblewrap) instead of `npm install -g @bubblewrap/cli` on a bare
# runner — the CLI's own JDK/Android-SDK auto-installer prompts
# interactively even in CI (see GoogleChromeLabs/bubblewrap#806), which
# would hang a plain runner. The container ships those dependencies
# pre-installed, avoiding that prompt entirely.
#
# `bubblewrap build` alone does NOT generate the native Android project —
# only `init`/`update` do that — so this workflow runs `update` first to
# regenerate the project from twa-manifest.json, then `build`.
#
# ONE-TIME SETUP REQUIRED BEFORE THIS WORKFLOW WILL WORK — see
# docs/ANDROID.md. In short:
#   1. Deploy frontend/ to a live HTTPS URL.
#   2. Commit twa-manifest.json to the repo root (already done if you
#      followed docs/ANDROID.md).
#   3. Add these repository secrets (Settings → Secrets and variables →
#      Actions): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#      ANDROID_KEY_PASSWORD. (The key alias comes from twa-manifest.json
#      itself, not a secret.)
#   4. Update frontend/.well-known/assetlinks.json with the real
#      package name + SHA-256 fingerprint and redeploy the frontend.
#
# Without step 1-2, this workflow has nothing to build from and will fail
# at the "Check twa-manifest.json exists" step — that's expected until
# the one-time setup is done.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'twa-manifest.json'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/googlechromelabs/bubblewrap:latest
    steps:
      - uses: actions/checkout@v4

      - name: Check twa-manifest.json exists
        run: |
          if [ ! -f twa-manifest.json ]; then
            echo "::error::twa-manifest.json not found in repo root. See docs/ANDROID.md."
            exit 1
          fi

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — see docs/ANDROID.md."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android.keystore

      - name: Regenerate Android project from twa-manifest.json
        run: bubblewrap update --skipVersionUpgrade

      - name: Build signed app bundle + APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Upload app bundle + APK
        uses: actions/upload-artifact@v4
        with:
          name: makari-islamic-tv-android
          path: |
            app-release-signed.aab
            app-release-signed.apk
          if-no-files-found: error

      - name: Clean up keystore
        if: always()
        run: rm -f android.keystore
